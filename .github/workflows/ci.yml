name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (unit, integration, security)
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          DATA_DIR: /tmp/ci-data
          NEXT_TELEMETRY_DISABLED: 1

  image:
    name: Docker image smoke build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: printique:ci

      - name: Boot container & verify health + home + security headers
        run: |
          docker run -d --name printique -p 3000:3000 \
            -e APP_SECRET=ci-secret-not-real-0123456789abcdef \
            printique:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sfS http://localhost:3000/api/health
          curl -sfS -o /dev/null -w "home: %{http_code}\n" http://localhost:3000/
          curl -s -D - -o /dev/null http://localhost:3000/ | grep -i "content-security-policy"
          docker stop printique

  audit:
    name: Dependency audit (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true # informational — release gates evaluate manually
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
